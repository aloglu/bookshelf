<title>Bookshelf Notes Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400..700&display=swap">
<style>

:root {
  --wall-l: #e9e0d0; --wall2-l: #ded2bf; --ink-l: #2b1f16; --muted-l: #75634f; --surface-l: #f6efe3; --line-l: rgba(43, 31, 22, .16); --accent-l: #2f4f3c; --accent-ink-l: #f3ead8;
  --wall-d: #17110d; --wall2-d: #100b08; --ink-d: #f0e4d0; --muted-d: #ad9a80; --surface-d: #241a12; --line-d: rgba(240, 228, 208, .12);
  --side: 18px; --crown: 18px; --base: 16px; --ribbon-day: #8e2532; --ribbon-night: #8e2532; --ribbon: var(--ribbon-day);
  --wall: var(--wall-l); --wall-2: var(--wall2-l); --ink: var(--ink-l); --muted: var(--muted-l);
  --surface: var(--surface-l); --line: var(--line-l); --accent: var(--accent-l); --accent-ink: var(--accent-ink-l);
  --scrim: rgba(43, 31, 22, .42);
  --shade: rgba(40, 24, 10, .34); --shadow: rgba(40, 24, 10, .42);
  /* Paper stays paper in both modes; the evening sheet is just a little dimmer. */
  --paper: #f7f1e5; --paper-ink: #2a2018; --paper-muted: #7a6956; --paper-line: rgba(42, 32, 24, .15); --paper-accent: #2f4f3c;
  --display: "Fraunces Variable", "Iowan Old Style", Georgia, serif;
  --ui: "Instrument Sans Variable", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --faded: saturate(.15) contrast(.7) brightness(1.12);
  --danger: #a3321f; --field: rgba(43, 31, 22, .04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wood: var(--wood-night); --wood-v: var(--wood-night-v, none); --wood-back: var(--wood-night-back, none); --ribbon: var(--ribbon-night);
    --wall: var(--wall-d); --wall-2: var(--wall2-d); --ink: var(--ink-d); --muted: var(--muted-d);
    --surface: var(--surface-d); --line: var(--line-d); --accent: #c9a35a; --accent-ink: #1c130c;
    --scrim: rgba(6, 3, 1, .66);
    --shade: rgba(0, 0, 0, .5); --shadow: rgba(0, 0, 0, .7);
    --paper: #e6dcc7; --paper-muted: #6e5f4e;
    --danger: #e8896c; --field: rgba(240, 228, 208, .05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wood: var(--wood-night); --wood-v: var(--wood-night-v, none); --wood-back: var(--wood-night-back, none); --ribbon: var(--ribbon-night);
  --wall: var(--wall-d); --wall-2: var(--wall2-d); --ink: var(--ink-d); --muted: var(--muted-d);
  --surface: var(--surface-d); --line: var(--line-d); --accent: #c9a35a; --accent-ink: #1c130c;
  --scrim: rgba(6, 3, 1, .66);
  --shade: rgba(0, 0, 0, .5); --shadow: rgba(0, 0, 0, .7);
  --paper: #e6dcc7; --paper-muted: #6e5f4e;
  --danger: #e8896c; --field: rgba(240, 228, 208, .05);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* iOS would otherwise enlarge small text in wide blocks on its own */   /* a search that shortens the page never shifts the header sideways */
body {
  background: radial-gradient(1200px 500px at 50% -120px, var(--wall), var(--wall-2) 75%);
  background-color: var(--wall-2);
  color: var(--ink); font-family: var(--ui); font-size: 15px;
  min-height: 100vh; -webkit-font-smoothing: antialiased;
  padding-inline: 16px; overflow-x: clip;
  transition: background-color .4s;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.field { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; width: 250px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
.field:focus-within { border-color: color-mix(in oklab, var(--accent) 60%, transparent); }
/* Search folds into an icon at the head of the tools. Hovered, tapped, focused, or holding a query, the field
   grows out of the icon (on a click or tap, never on hover) as an overlay toward the free space beside it (leftward on a wide screen, across
   the row on a phone), so nothing else in the row ever moves or wraps. It grows by its width, not a
   transform, so its text never re-settles. */
.search { position: relative; flex: none; width: 40px; height: 40px; }
.search .field { position: absolute; right: 0; top: 0; z-index: 4; width: 40px; padding: 0 10px; overflow: hidden; cursor: pointer; transition: width .26s var(--ease), border-color .2s; }
.search .field .i { flex: none; }
.search .field:focus-within, .search.has-query .field { width: 270px; cursor: text; }
.btn.icon[aria-pressed="true"] { background: color-mix(in oklab, var(--accent) 16%, var(--surface)); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
.field input { all: unset; flex: 1; min-width: 0; color: var(--ink); font-size: .92rem; }
.field input::placeholder { color: var(--muted); }
.seg { position: relative; isolation: isolate; display: flex; height: 40px; padding: 3px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.seg button { padding: 0 12px; border-radius: 5px; color: var(--muted); font-size: .86rem; font-weight: 500; transition: background-color .2s, color .28s var(--ease); }
/* The chosen button's highlight is one pill behind them all (lib/pill.js), which slides to a new choice. */
.seg .pill { position: absolute; z-index: -1; top: 3px; bottom: 3px; left: 0; width: var(--w, 0); border-radius: 5px; transform: translateX(var(--x, 3px)) scaleX(var(--sx, 1)); transform-origin: 0 0; background: color-mix(in oklab, var(--accent) 16%, transparent); pointer-events: none; }
.seg .pill.ready { transition: transform .28s var(--ease); }
.seg .pill.none { display: none; }
/* The sort's direction: an arrow on the active button, up for A to Z and oldest first, down the other way.
   Every sort button keeps its room, so the buttons never change width. */
.seg .dir { width: 12px; height: 12px; margin-left: 4px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; transition: rotate .2s; }
.seg button:has(.dir) { display: inline-flex; align-items: center; justify-content: center; }
.seg .dir.shown { visibility: visible; }
.seg .dir.down { rotate: 180deg; }
@media (prefers-reduced-motion: reduce) { .seg .dir, .seg .pill.ready, .seg button { transition: none; } }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: color-mix(in oklab, var(--accent) 16%, transparent); color: var(--ink); }
.seg:has(> .pill) > button[aria-pressed="true"], .seg:has(> .pill) > button[aria-selected="true"] { background: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; font-weight: 500; }
a.btn { color: var(--ink); text-decoration: none; }
/* A new version is out: a small dot on Settings (and on the phone's menu), in the accent so red stays the ribbon's. */
.btn.dot, .pm-list .dot, .dtabs .dot { position: relative; }
.dtabs .dot::after { content: ""; position: absolute; top: 6px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.btn.dot::after, .pm-list .dot::after { content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.pm-list .dot::after { top: 50%; right: 14px; translate: 0 -50%; }   /* downloads look like the buttons beside them */
.btn.icon { width: 40px; padding: 0; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.shelf { position: relative; padding-top: 44px; content-visibility: auto; contain-intrinsic-size: auto 360px; overflow-clip-margin: 36px; }   /* shelves out of view are not laid out or painted, so a big library costs what a screenful does */
.books {
  position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 2px;
  height: var(--row-h); padding-inline: 6px;
}
.books.full { justify-content: space-between; }
.plank {
  position: relative; z-index: 1; height: 13px; border-radius: 5px;
  background:
    linear-gradient(rgba(255,255,255,.34), rgba(255,255,255,.1) 3px, transparent 50%, rgba(0,0,0,.24)),
    var(--wood) var(--wx, 0) center / 1024px auto;
  box-shadow: 0 12px 16px -10px var(--shadow), 0 3px 4px -2px var(--shade);
}
@property --glow { syntax: "<number>"; inherits: false; initial-value: 0; }
.slot {
  --pull: 40px; --lift: 4px;
  position: relative; flex: none; width: var(--t); height: var(--h);
}
.slot:focus-visible { outline-offset: 4px; }
.slot.peek { z-index: 3; }
.slot.out .spine { visibility: hidden; transition: none; inset: 0; }
.spine {
  position: absolute; inset: 0; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; padding-block: 16px 13px;
  color: var(--fg); border-radius: 4px / 3px;   /* softened like a real spine's turned-in cloth */
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(0,0,0,.34), rgba(255,255,255,.12) 20%, rgba(255,255,255,0) 48%, rgba(0,0,0,.08) 72%, rgba(0,0,0,.36)),
    linear-gradient(rgba(0,0,0,.18), transparent 6px, transparent calc(100% - 5px), rgba(0,0,0,.25)),
    var(--cloth), var(--c);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.16);
  transition: box-shadow .3s var(--ease), top .3s var(--ease), bottom .3s var(--ease);
}
.slot.peek .spine { top: calc(-1 * var(--lift)); bottom: var(--lift); box-shadow: inset 0 0 0 1px rgba(0,0,0,.16), 0 14px 22px -10px rgba(0,0,0,.55); }
.spine::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(rgba(255, 244, 224, calc(.14 * var(--glow))), transparent 60%); transition: --glow .3s var(--ease); pointer-events: none; }
.slot.peek .spine::after { --glow: 1; }
/* The book being read has its ribbon marker out: it hangs from the foot of the spine over the front of the
   plank, forked at the end, clear of the lettering. */
.slot.reading { z-index: 2; }
.slot.reading::after {
  content: ""; position: absolute; left: 50%; top: calc(100% - 3px); width: 7px; height: 30px; translate: -50% 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 35%, rgba(255,255,255,.18) 55%, transparent 75%, rgba(0,0,0,.25)), var(--ribbon);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); filter: drop-shadow(0 2px 2px rgba(0,0,0,.35));
}
.slot.reading.out::after { display: none; }
.slot.reading::after { transition: top .3s var(--ease); }   /* by position, like the spine it hangs from */
.slot.peek.reading::after { top: calc(100% - 3px - var(--lift)); }
/* Bindings. A paperback is the plain spine above; the others add what tells them apart on a real shelf,
   all in paint, nothing that would bulk up a big library. The same rules draw the book in flight (its
   lengths scaled by --k), so a book never changes its binding on the way out.
   - Hardcover: a rounded spine, light down the middle and falling away to the edges; a crease along each
     joint where the boards hinge; and the boards' edges standing proud at head and tail.
   - Cloth: the same boards, a fine woven texture, and the title stamped in gilt.
   - Leather: a deeper, burnished skin, a raised band at head and tail with a gilt rule beside it, and gilt
     lettering pressed in.
   Every binding keeps the spine in its cover's own color: the shading on top is no darker than a
   paperback's, so only the texture and the details tell the bindings apart. */
:root:not([data-plain]) :is(.slot[data-b="hardcover"] .spine, .tome[data-b="hardcover"] .t-spine, .slot[data-b="cloth"] .spine, .tome[data-b="cloth"] .t-spine) {
  --j: clamp(calc(2.5px * var(--k, 1)), 9%, calc(6px * var(--k, 1)));
  background:
    linear-gradient(90deg, transparent var(--j), rgba(0,0,0,.26) var(--j), rgba(255,255,255,.1) calc(var(--j) + 1px * var(--k, 1)), transparent calc(var(--j) + 2px * var(--k, 1)),
      transparent calc(100% - var(--j) - 2px * var(--k, 1)), rgba(255,255,255,.1) calc(100% - var(--j) - 1px * var(--k, 1)), rgba(0,0,0,.26) calc(100% - var(--j)), transparent calc(100% - var(--j))),
    linear-gradient(90deg, rgba(0,0,0,.32), transparent 24%, rgba(255,255,255,.12) 50%, transparent 76%, rgba(0,0,0,.34)),
    linear-gradient(rgba(255,255,255,.16) 0 calc(2px * var(--k, 1)), rgba(0,0,0,.24) calc(2px * var(--k, 1)), transparent calc(8px * var(--k, 1)),
      transparent calc(100% - 8px * var(--k, 1)), rgba(0,0,0,.28) calc(100% - 2px * var(--k, 1)), rgba(255,255,255,.12) calc(100% - 2px * var(--k, 1))),
    var(--weave, linear-gradient(transparent, transparent)), var(--cloth), var(--c);
}
:root:not([data-plain]) :is(.slot[data-b="cloth"] .spine, .tome[data-b="cloth"] .t-spine) {
  --weave: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 calc(1px * var(--k, 1)), transparent 0 calc(2px * var(--k, 1))),
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 calc(1px * var(--k, 1)), transparent 0 calc(2px * var(--k, 1)));
}
:root:not([data-plain]) :is(.slot[data-b="leather"] .spine, .tome[data-b="leather"] .t-spine) {
  --gilt: #d8b467;
  background:
    linear-gradient(transparent calc(8px * var(--k, 1)), rgba(255,255,255,.2) calc(8px * var(--k, 1)), rgba(0,0,0,.34) calc(11px * var(--k, 1)), transparent calc(11px * var(--k, 1)),
      transparent calc(13px * var(--k, 1)), var(--gilt) calc(13px * var(--k, 1)), var(--gilt) calc(14px * var(--k, 1)), transparent calc(14px * var(--k, 1)),
      transparent calc(100% - 14px * var(--k, 1)), var(--gilt) calc(100% - 14px * var(--k, 1)), var(--gilt) calc(100% - 13px * var(--k, 1)), transparent calc(100% - 13px * var(--k, 1)),
      transparent calc(100% - 11px * var(--k, 1)), rgba(255,255,255,.18) calc(100% - 11px * var(--k, 1)), rgba(0,0,0,.34) calc(100% - 8px * var(--k, 1)), transparent calc(100% - 8px * var(--k, 1))),
    linear-gradient(90deg, rgba(0,0,0,.32), transparent 22%, rgba(255,236,200,.13) 46%, transparent 70%, rgba(0,0,0,.34)),
    radial-gradient(120% 40% at 50% 30%, rgba(255,230,190,.06), transparent 70%),
    var(--cloth), var(--cloth), var(--c);
}
/* Leather lettering keeps clear of the bands at head and tail. */
:root:not([data-plain]) :is(.slot[data-b="leather"] .spine, .tome[data-b="leather"] .t-face) { padding-block: 25px 23px; }
:root:not([data-plain]) :is(.slot[data-b="leather"], .tome[data-b="leather"]) .st { max-height: calc(var(--h) - 106px); }
/* Gilt lettering for leather and cloth, pressed in: a hair of shadow above, light below. */
:root:not([data-plain]) :is(.slot[data-b="leather"], .slot[data-b="cloth"], .tome[data-b="leather"], .tome[data-b="cloth"]) :is(.st, .sa) {
  color: #e2c27a; text-shadow: 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 rgba(255,240,200,.12);
}
.st, .sa { writing-mode: vertical-rl; text-orientation: sideways; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { font-family: var(--display); font-weight: 600; font-size: clamp(10px, calc(var(--t) * .4), 16px); max-height: calc(var(--h) - 88px); }
.sa { font-size: clamp(7.5px, calc(var(--t) * .27), 10.5px); letter-spacing: .14em; text-transform: uppercase; opacity: .82; max-height: 84px; }   /* a long name shortens before it can crowd the title */
.slot.is-hidden .spine { filter: var(--faded); }
.slot.is-hidden .eye { display: block; }
.eye { display: none; position: absolute; left: 50%; bottom: 8px; translate: -50% 0; width: 13px; height: 13px; color: var(--fg); }

/* Cards over the shelf: signing in, adding a book, Settings and the rest. They float, standing off the page by
   their shadow and edge, and dim it as the open book does (decided 2026-10-13). On a phone a card sits at the
   foot of the screen, clear of every edge and above the home indicator. On iOS, Safari colours its bars from
   the page and changes them on its own schedule, so they can lag a moment behind a card's closing. */
.modal { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: 16px; }
.modal-scrim { position: absolute; inset: 0; background: var(--scrim); }   /* the open book's dimming: one color, one timing (DIM in model.js) */
.card {
  position: relative; width: min(460px, 100%); max-height: calc(100vh - 32px); overflow: auto;
  padding: 28px; border-radius: 14px; background: var(--surface); border: 1px solid color-mix(in oklab, var(--ink) 16%, transparent);
  box-shadow: 0 28px 70px -18px rgba(0,0,0,.6), 0 3px 12px rgba(0,0,0,.28);
}
.card.wide { width: min(620px, 100%); }
.card:focus { outline: none; }   /* on a touch screen the card itself takes focus as it opens (lib/panels.js); that needs no ring */
.card h2 { margin: 0 0 4px; padding-right: 44px; font-family: var(--display); font-weight: 600; font-size: 1.75rem; line-height: 1.1; letter-spacing: -.01em; font-variation-settings: "opsz" 72; }
.lede { margin: 0 0 22px; color: var(--muted); font-size: .9rem; line-height: 1.45; }
.x { position: absolute; top: 16px; right: 16px; }
.stack { display: grid; gap: 14px; }
.lab { display: grid; gap: 6px; min-width: 0; font-size: .78rem; color: var(--muted); }
.inp { width: 100%; height: 42px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; font-size: .95rem; }
.inp:focus { outline: 2px solid color-mix(in oklab, var(--accent) 70%, transparent); outline-offset: -1px; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 17px) 18px, calc(100% - 12px) 18px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
select.inp option { background: var(--surface); color: var(--ink); }   /* the open list in the page's colors, not the browser's light ones */
.inp.isbn { height: 52px; font-family: var(--display); font-size: 1.35rem; letter-spacing: .01em; font-variant-numeric: lining-nums tabular-nums; }   /* set as the title page sets it */
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.row-btns.end { justify-content: flex-end; }
.err { margin: 0; min-height: 1.3em; color: var(--danger); font-size: .84rem; }
.fine { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.5; }
.fine .link, .credit-links .link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in oklab, var(--ink) 35%, transparent); }
.tag { font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 5px; background: color-mix(in oklab, var(--ink) 8%, transparent); color: var(--ink); }
.status { display: flex; align-items: center; gap: 10px; min-height: 1.4em; margin: 0; font-size: .9rem; color: var(--muted); }
.status.ok { color: var(--ink); }
.spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid color-mix(in oklab, var(--muted) 35%, transparent); border-top-color: var(--accent); animation: spin .7s linear infinite; }
@keyframes spin { to { rotate: 1turn; } }
.check2 { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--ink); }
.check2 input { accent-color: var(--accent); width: 16px; height: 16px; }
.btn.danger { background: #a3321f; color: #fff; border-color: transparent; }
.lab .opt { color: var(--muted); font-weight: 400; }
.wordmark { margin: 0 0 18px; font-family: var(--display); font-size: .82rem; font-style: italic; color: var(--muted); }

/* A setting that is on or off: what it does on the left, a switch on the right. */
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
.toggle b { display: block; font-weight: 600; font-size: .92rem; }
.toggle small { display: block; margin-top: 2px; color: var(--muted); font-size: .8rem; line-height: 1.4; }
.toggle input, .switch { appearance: none; flex: none; position: relative; width: 38px; height: 22px; margin: 0; border-radius: 99px; background: color-mix(in oklab, var(--ink) 18%, transparent); cursor: pointer; transition: background-color .28s var(--ease); }
.toggle input::after, .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .28s var(--ease); }
.toggle input:checked, .switch:checked { background: var(--accent); }
.toggle input:checked::after, .switch:checked::after { left: 19px; }
@media (prefers-reduced-motion: reduce) { .toggle input, .toggle input::after, .switch, .switch::after { transition: none; } }
.snav { display: flex; flex-direction: column; gap: 2px; padding: 24px 12px; border-right: 1px solid var(--line); background: color-mix(in oklab, var(--ink) 3%, var(--surface)); }
.snav h2 { margin: 0 10px 16px; padding: 0; font-size: 1.5rem; }
.snav button:not(.x) { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; color: var(--muted); text-align: left; font-size: .9rem; font-weight: 500; transition: background-color .2s, color .2s; }
.snav button:not(.x) .i { width: 17px; height: 17px; }
.snav button:not(.x)[aria-current="true"] { background: color-mix(in oklab, var(--accent) 16%, transparent); color: var(--ink); }
@media (hover: hover) { .snav button:not(.x):not([aria-current="true"]):hover { background: color-mix(in oklab, var(--ink) 5%, transparent); color: var(--ink); } }
.snav .chev { display: none; margin-left: auto; }
.snav .dot::after { content: ""; width: 7px; height: 7px; margin-left: auto; border-radius: 50%; background: var(--accent); }
.snav .spacer { flex: 1; }
.snav .ver { margin: 0 10px; color: var(--muted); font-size: .74rem; }
.snav .phone-x { display: none; }
.spane { min-width: 0; overflow: auto; padding: 22px 30px 34px; }
.spane-head { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.spane-head h2 { flex: 1; margin: 0; padding: 0; font-size: 1.5rem; }
.spane-head .back { display: none; }
.sbody { display: grid; gap: 26px; margin-top: 22px; }
.sgroup { display: grid; min-width: 0; }
.sgroup h3 { margin: 0 0 2px; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.sgroup .sdesc { margin: 4px 0 4px; color: var(--muted); font-size: .8rem; line-height: 1.45; }
.sgroup .fine { margin-top: 8px; }
.srow { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 6px 18px; align-items: center; min-height: 52px; padding: 9px 0; }
.srow.full { grid-template-columns: minmax(0, 1fr); }
.sname { font-size: .92rem; }
.sname small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.35; }
.sctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
.srow.full .sctl > :not(.btn) { flex: 1 1 100%; }
.srow.full .sctl > .btn { margin-left: auto; }
.sctl .swatches, .sctl .woods { justify-content: flex-end; }
.sctl .bad { border-color: var(--danger); }
.sctl .iconpick img { width: 42px; height: 42px; border-radius: 10px; }
.sctl .backups { width: 100%; }
.sctl select.inp { width: auto; max-width: 100%; text-overflow: ellipsis; }   /* never wider than its place beside the name; a long choice shortens */
.range { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 300px; }
.range input { flex: 1; }
.range output { min-width: 4.6em; text-align: right; font-size: .86rem; font-variant-numeric: tabular-nums; }
.sgroup.aligned .seg { min-width: 19rem; }
.sgroup.aligned .seg button { flex: 1 0 auto; }
.drop { display: grid; place-items: center; gap: 4px; padding: 18px; border-radius: 10px; border: 1.5px dashed var(--line); text-align: center; color: var(--muted); font-size: .86rem; cursor: pointer; transition: border-color .2s, background-color .2s; }
.drop b { color: var(--ink); font-weight: 600; }
.drop.over { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }
.btn.sm { height: 32px; padding: 0 10px; font-size: .8rem; }

  --wood: var(--wood-day);
  --row-h: 292px; --cloth: linear-gradient(transparent, transparent);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wood: var(--wood-night); } }
:root[data-theme="dark"] { --wood: var(--wood-night); }
body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; }
.i { pointer-events: none; }

/* ---------- The study's controls (not part of the app) ---------- */
.studybar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-inline: -16px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.studybar .name { margin-right: auto; font-family: var(--display); font-weight: 600; font-size: 1.05rem; font-variation-settings: "opsz" 36; }
.studybar .seg { height: 34px; }
.studybar .seg button { font-size: .8rem; padding: 0 10px; }
.dn { max-width: 760px; margin: 40px auto 0; padding: 18px 20px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: .86rem; line-height: 1.55; }
.dn h3 { margin: 0 0 8px; font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.dn ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.dn b { color: var(--ink); font-weight: 600; }
.opt-panel { max-width: 760px; margin: 28px auto 0; display: grid; gap: 12px; padding: 18px 20px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.opt-panel h3 { margin: 0; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.opt-panel p { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.5; }

/* ---------- The screen: a desktop window, or a phone ---------- */
.screen { position: relative; container-type: inline-size; width: 100%; min-height: calc(100svh - 70px); padding-bottom: 60px; }
.screen.phone { width: 390px; max-width: 100%; margin: 22px auto 40px; min-height: 780px; padding-inline: 16px; border-radius: 30px; border: 1px solid var(--line); background: radial-gradient(900px 400px at 50% -80px, var(--wall), var(--wall-2) 75%); background-color: var(--wall-2); box-shadow: 0 30px 70px -30px rgba(0,0,0,.5); overflow: clip; }
.page { max-width: 1200px; margin: 0 auto; }
.screen.phone .page { max-width: none; }
.layer { position: sticky; top: 0; z-index: 30; display: grid; place-items: center; height: 100svh; margin-bottom: -100svh; padding: 16px; pointer-events: none; }
.screen.phone .layer { height: 780px; margin-bottom: -780px; padding: 12px; align-items: end; }
.layer > * { pointer-events: auto; }
.layer .scrim { position: absolute; top: 0; bottom: 0; left: -100vw; right: -100vw; background: var(--scrim); pointer-events: auto; }
.layer .card { z-index: 1; }
.screen.phone .layer .scrim { left: 0; right: 0; }
.screen.phone .layer .card { width: 100%; max-height: 92%; padding: 22px; }

/* ---------- Header ---------- */
.hd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 24px; align-items: end; padding-block: 34px 8px; }
.hd .brand h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(2.1rem, 5vw, 3.1rem); line-height: 1; letter-spacing: -.02em; font-variation-settings: "opsz" 120; }
.hd .brand h1 a { color: inherit; text-decoration: none; }
.hd .tools { flex-wrap: nowrap; justify-content: flex-end; }
.hd .reading-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; min-height: 40px; margin-top: 8px; color: var(--muted); font-size: .9rem; }
.hd .reading-row .cv { --cw: 22px; }
.hd .reading-row b { color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 1.05em; }
.hd .reading-row .jot { margin-left: 4px; }
.btn.icon.sm { width: 32px; height: 32px; }
.btn.icon .i { width: 18px; height: 18px; }
.btn.icon.sm .i { width: 16px; height: 16px; }
.hd .tools .new-dot { position: relative; }
.hd .tools .new-dot::after { content: ""; position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--ribbon); box-shadow: 0 0 0 2px var(--surface); }
@container (max-width: 640px) {
  .hd { padding-block: 24px 6px; gap: 8px 12px; }
  .hd .brand h1 { font-size: 2rem; }
  .hd .tools { gap: 6px; }
  .hd .reading-row { font-size: .84rem; }
  .hd .desk-only { display: none; }
}
@container (min-width: 641px) { .hd .phone-btn { display: none; } }

/* ---------- Covers drawn in CSS (a plain cloth cover with its title stamped on, as the app draws one) ---------- */
.cv { --cw: 112px; position: relative; display: inline-flex; flex: none; width: var(--cw); aspect-ratio: 2 / 3; padding: calc(var(--cw) * .12) calc(var(--cw) * .1); border-radius: 2px 4px 4px 2px; background: linear-gradient(90deg, rgba(0,0,0,.34), rgba(0,0,0,0) 9%), linear-gradient(rgba(255,255,255,.06), rgba(0,0,0,.14)), var(--c); color: var(--fg); box-shadow: 0 14px 26px -14px rgba(0,0,0,.65); overflow: hidden; align-items: center; justify-content: center; text-align: center; font-family: var(--display); font-weight: 600; line-height: 1.12; font-size: calc(var(--cw) * .1); letter-spacing: .01em; font-variation-settings: "opsz" 24; }
.cv span { display: block; overflow-wrap: break-word; hyphens: auto; }
.cv::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 14%; height: 1px; background: currentColor; opacity: .45; }
button.cv { padding: calc(var(--cw) * .12) calc(var(--cw) * .1); cursor: pointer; }
.cv.sm { --cw: 22px; border-radius: 1px 2px 2px 1px; box-shadow: 0 3px 8px -3px rgba(0,0,0,.5); font-size: 0; }
.cv.sm::after { display: none; }

/* The book's page: a title page, reduced to what this study shows (the flight is not acted out here). */
.bookcard.card { width: min(760px, 100%); padding: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); overflow: hidden; }
.bookcard .board { display: grid; place-items: center; padding: 34px 20px; background: color-mix(in oklab, var(--c) 40%, #1b130d); }
.bookcard .page-r { position: relative; padding: 38px 34px 30px; background: var(--paper); color: var(--paper-ink); text-align: center; display: grid; justify-items: center; gap: 0; }
.bookcard .x { color: var(--paper-ink); }
.bookcard .kick { margin: 0; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--paper-muted); }
.bookcard h2 { margin: 14px 0 0; padding: 0; font-size: 2.1rem; color: var(--paper-ink); }
.bookcard .by { margin: 10px 0 0; font-family: var(--display); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.1rem; }
.bookcard .facts { margin: 14px 0 0; color: var(--paper-muted); font-size: .84rem; }
.bookcard .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin-top: 22px; }
.act { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; color: var(--paper-ink); font-size: .84rem; font-weight: 500; border: 1px solid var(--paper-line); background: transparent; }
.act.solid { background: var(--paper-accent); color: #f3ead8; border-color: transparent; }
.act .i { width: 15px; height: 15px; }
.act .ct { font-variant-numeric: tabular-nums; opacity: .75; }
@media (hover: hover) { .act:hover { background: color-mix(in oklab, var(--paper-accent) 10%, transparent); } .act.solid:hover { background: color-mix(in oklab, var(--paper-accent) 88%, black); } }
.screen.phone .bookcard.card { grid-template-columns: 1fr; max-height: 92%; overflow: auto; }
.screen.phone .bookcard .board { padding: 22px; }
.screen.phone .bookcard .board .cv { --cw: 96px !important; }
.screen.phone .bookcard .page-r { padding: 26px 20px 22px; }

/* ---------- All notes ---------- */
.tl { max-width: none; margin: 0 auto; padding-block: 26px 40px; }
.tl-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.9rem, 4.6vw, 2.8rem); line-height: 1.05; font-variation-settings: "opsz" 72; }
.tl-head p { margin: 10px 0 0; color: var(--muted); font-size: .94rem; }
.tl-month { margin: 34px 0 4px; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.tl-e { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 18px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.tl-e .cv { --cw: 52px !important; }
.tl-e .bk { display: block; margin: 0 0 10px; color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; text-align: left; }
.tl-e .bk b { color: var(--ink); font-weight: 600; }
@media (hover: hover) { .tl-e .bk:hover b { text-decoration: underline; text-underline-offset: 3px; } }
.tl-e .nb-e { display: grid; padding: 0; border: 0; }
@container (max-width: 640px) { .tl-e { grid-template-columns: 40px minmax(0, 1fr); gap: 14px; } .tl-e .cv { --cw: 40px !important; } }

/* ---------- Settings, export and import ---------- */
.set-card.card { position: relative; display: grid; grid-template-columns: 200px minmax(0, 1fr); width: min(900px, 100%); max-height: none; margin: 30px auto 0; padding: 0; overflow: hidden; }
.set-card .spane { padding: 22px 30px 34px; }
.set-card .snav { padding: 24px 12px; }
.snav button.cur { background: color-mix(in oklab, var(--accent) 16%, transparent); color: var(--ink); }
.set-card .sdesc { margin-bottom: 8px; }
.sgroup + .sgroup { margin-top: 4px; }
.bookrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 9px 0; }
.bookrow .cv { --cw: 30px; font-size: 0; border-radius: 1px 3px 3px 1px; }
.bookrow .cv::after { display: none; }
.bookrow b { display: block; font-family: var(--display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.bookrow small { color: var(--muted); font-size: .78rem; }
.bookrow .state { color: var(--muted); font-size: .8rem; text-align: right; white-space: nowrap; }
.sctl select.inp { min-width: 11em; }
.seg.wide button { flex: 1 0 auto; }
.mdprev { margin: 0; padding: 16px 18px; max-height: 340px; overflow: auto; border-radius: 10px; background: var(--field); border: 1px solid var(--line); font: .8rem/1.55 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.imp-list { display: grid; gap: 0; margin: 14px 0 4px; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.imp-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.imp-list b { font-family: var(--display); font-weight: 600; }
.imp-list small { color: var(--muted); font-size: .78rem; }
.imp-list .st2 { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; color: var(--muted); font-size: .8rem; }
.imp-list .st2.ok { color: var(--ink); }
.imp-list .skip { opacity: .6; }
@container (max-width: 700px) {
  .set-card.card { grid-template-columns: 1fr; }
  .set-card .snav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 12px; }
  .set-card .snav h2 { width: 100%; margin-bottom: 6px; }
  .set-card .spane { padding: 18px 18px 30px; }
  .srow { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .sctl { justify-content: flex-start; }
  .bookrow { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .bookrow .state { display: none; }
  .sgroup.aligned .seg { min-width: 0; width: 100%; }
}

/* ---------- Toast and menu ---------- */
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px); padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--ink); color: var(--wall-2); box-shadow: 0 18px 40px -16px rgba(0,0,0,.6); font-size: .9rem; animation: tin .3s var(--ease); }
@keyframes tin { from { opacity: 0; translate: -50% 10px; } }
.toast button { font-weight: 600; color: inherit; text-decoration: underline; text-underline-offset: 3px; padding: 4px 6px; }
.pm-list { display: grid; margin-top: 6px; }
.pm-list button { display: flex; align-items: center; gap: 14px; padding: 13px 4px; font-size: 1rem; text-align: left; border-top: 1px solid var(--line); }
.pm-list button .i { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
@container (max-width: 640px) { .opt-panel .seg.wide { flex-direction: column; height: auto; } .opt-panel .seg.wide button { height: 36px; } }

.key { display: block; margin-top: 8px; line-height: 2.4; }
.key .btn, .key .lnk { vertical-align: middle; pointer-events: none; }

/* Finder (Settings): type to narrow, never a list of every book */
.finder { display: grid; gap: 6px; margin-top: 10px; }
.fsearch { position: relative; display: block; }
.fsearch .i { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); }
.fsearch input { width: 100%; padding-left: 34px; }
.fcap { margin: 6px 0 0; color: var(--muted); font-size: .78rem; letter-spacing: .02em; }
.flist { display: grid; margin: 0; padding: 0; list-style: none; }
.flist li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.flist li:last-child { border-bottom: 0; }
.flist .cv { --cw: 28px !important; font-size: 0; border-radius: 1px 3px 3px 1px; }
.flist .cv::after { display: none; }
.flist b { display: block; font-family: var(--display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.flist small { color: var(--muted); font-size: .78rem; }
.flist.hidden { border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.sfind { padding: 14px 0 4px; }
.sfind .sname small { display: block; }

/* Several books under way: the header's small covers fan out */
.hd .reading-row .fan { display: inline-flex; }
.hd .reading-row .fan .cv + .cv { margin-left: -9px; }



/* =========================================================================================
   A book's notes. One control height (--ctl) for everything you tap: 36px with a pointer, 44px on a phone.
   ========================================================================================= */
.page { --ctl: 36px; }
.nb2 { display: grid; gap: 18px; padding-block: 22px 40px; }
.nb-side { min-width: 0; }
.nb-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.nb-kick { margin: 0 0 8px; color: var(--muted); font-size: .74rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
.nb-head h2 button { all: unset; cursor: pointer; }
.nb-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.9rem, 4.6vw, 2.6rem); line-height: 1.05; letter-spacing: -.012em; font-variation-settings: "opsz" 72; }
.nb-by { margin: 8px 0 0; font-family: var(--display); font-size: 1.12rem; font-style: italic; font-variation-settings: "opsz" 36; }
.nb-facts { margin: 10px 0 0; color: var(--muted); font-size: .86rem; }
.prog { display: grid; gap: 8px; margin-top: 16px; max-width: 340px; }
.prog .bar { height: 5px; border-radius: 3px; background: color-mix(in oklab, var(--ink) 12%, transparent); overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: var(--v); background: var(--ribbon); }
.prog .pg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; }
.prog .pace { flex-basis: 100%; }
.prog .pg input { width: 4.2em; height: var(--ctl); padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; }
.nb-main { min-width: 0; }
@container (min-width: 900px) {
  .nb2 { grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
  .nb-head h2 { font-size: 1.9rem; overflow-wrap: anywhere; }
  .nb-side { position: sticky; top: 16px; align-self: start; }
  .nb-head { grid-template-columns: 1fr; justify-items: start; gap: 22px; }
  .nb-head .cv { --cw: 200px !important; }
}

/* The list's header: a count, the order, and one menu. */
.nb-bar { display: flex; align-items: center; gap: 10px; min-height: var(--ctl); margin: 24px 0 4px; }
.nb-bar h3 { margin: 0 auto 0 0; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.nb-bar .seg { height: var(--ctl); padding: 2px; }
.nb-bar .seg button { padding: 0 12px; font-size: .8rem; }
.more { position: relative; display: inline-flex; }
.more-btn.btn.icon { width: var(--ctl); height: var(--ctl); }
.menu { position: absolute; z-index: 20; top: calc(100% + 6px); right: 0; width: max-content; max-width: min(300px, calc(100vw - 32px)); display: grid; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 18px 40px -14px rgba(0,0,0,.6); }
.menu .info { margin: 0; padding: 10px 12px 8px; color: var(--muted); font-size: .82rem; line-height: 1.4; }
.menu button { display: flex; align-items: center; gap: 12px; min-height: var(--ctl); padding: 0 12px; border-radius: 8px; background: none; color: var(--ink); font-size: .92rem; text-align: left; }
.menu button .i { width: 16px; height: 16px; color: var(--muted); }
.menu button:disabled { opacity: .45; }
.menu .info.sep { margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--line); font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.menu .ph { width: 16px; height: 16px; flex: none; }
@media (hover: hover) { .menu button:hover:not(:disabled) { background: color-mix(in oklab, var(--ink) 7%, transparent); } }

/* The list: rows, a hairline between them. A second reading only gets a caption. */
.nb-list { margin: 0; padding: 0; list-style: none; }
.rd + .rd { margin-top: 8px; }
.rd-cap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.rd-cap .lnk { letter-spacing: 0; text-transform: none; font-weight: 400; }
.nb-e { display: grid; gap: 8px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.rd .nb-e:last-child { border-bottom: 0; }
.nb-e blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--ribbon); font-family: var(--display); font-size: 1.16rem; line-height: 1.5; font-variation-settings: "opsz" 24; white-space: pre-wrap; text-wrap: pretty; }
.nb-e .txt { margin: 0; font-family: var(--display); font-size: 1.04rem; line-height: 1.55; font-variation-settings: "opsz" 18; white-space: pre-wrap; text-wrap: pretty; }
.nb-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; min-height: 28px; color: var(--muted); font-size: .8rem; }
.nb-meta .who { display: inline-flex; align-items: baseline; }
.nb-meta .where { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.nb-meta .where:not(:empty) + .dt::before { content: "·"; margin: 0 6px; }
.nb-meta .priv { display: inline-flex; align-items: center; gap: 5px; }
.nb-meta .priv .i { width: 13px; height: 13px; }
.nb-meta .saved:not(:empty)::before { content: "✓ "; }
.nb-tools { display: flex; align-items: center; gap: 4px 18px; margin-left: auto; }
.nb-empty { margin: 0; padding: 26px 0; color: var(--muted); font-size: .94rem; line-height: 1.55; text-align: center; font-family: var(--display); font-style: italic; }
.nb-e.editing { gap: 14px; margin-inline: -12px; padding-inline: 12px; border-radius: 10px; background: color-mix(in oklab, var(--ink) 3%, transparent); border-bottom-color: transparent; }
.nb-e.editing .nb-tools { gap: 8px 14px; }
.ed { cursor: text; outline: none; border-radius: 6px; background: color-mix(in oklab, var(--ink) 5%, transparent); box-shadow: 0 0 0 5px color-mix(in oklab, var(--ink) 5%, transparent); transition: background-color .15s, box-shadow .15s; }
.ed:empty::before { content: attr(data-ph); color: var(--muted); opacity: .7; }
.ed:focus { background: color-mix(in oklab, var(--ink) 9%, transparent); box-shadow: 0 0 0 5px color-mix(in oklab, var(--ink) 9%, transparent); }
.nb-e blockquote.ed { border-radius: 0 6px 6px 0; }
.nb-meta .where.ed { min-width: 3em; }

/* The editor: a quote from the book (optional), your thoughts, and one row. */
.cp { display: grid; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.cp:focus-within { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
.cp-body { display: grid; gap: 12px; }
.cp-bar { display: none; align-items: center; gap: 10px; min-height: var(--ctl); color: var(--muted); font-size: .95rem; text-align: left; background: none; }
.cp-bar .i { width: 16px; height: 16px; }
.cp textarea { display: block; width: 100%; padding: 0; border: 0; background: none; color: var(--ink); resize: none; field-sizing: content; font-family: var(--display); line-height: 1.55; font-variation-settings: "opsz" 24; }
.cp textarea:focus { outline: none; }
.cp textarea::placeholder { color: var(--muted); opacity: .8; }
.cp .cq { flex: none; min-height: 1.6em; padding-left: 12px; border-left: 2px solid color-mix(in oklab, var(--ribbon) 45%, transparent); font-size: 1.12rem; }
.cp .cq:focus { border-left-color: var(--ribbon); }
.cp .ct { flex: 1 1 auto; min-height: 1.6em; font-size: 1.05rem; }
.cp-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.cp-opts, .cp-act { display: flex; align-items: center; gap: 8px; }
.cp .err { margin: 0; min-height: 0; }
.cp .err:empty { display: none; }
.pagef { display: inline-flex; align-items: center; gap: 8px; height: var(--ctl); padding: 0 14px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: .84rem; }
.pagef:focus-within { border-color: color-mix(in oklab, var(--accent) 60%, transparent); }
.pagef input { width: 4em; min-width: 0; height: 100%; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; field-sizing: content; max-width: 7em; outline: none; }
.pagef input::placeholder { color: var(--muted); opacity: .8; }

.lnk { display: inline-flex; align-items: center; gap: 5px; position: relative; padding: 3px 0; background: none; color: var(--muted); font-size: .82rem; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in oklab, currentColor 30%, transparent); }
.lnk::after { content: ""; position: absolute; inset: -10px -8px; }
@media (hover: hover) { .lnk:hover { color: var(--ink); } }

@container (max-width: 640px) {
  .page { --ctl: 44px; }
  .nb2 { gap: 14px; padding-block: 14px 32px; }
  .nb-head { grid-template-columns: 56px minmax(0, 1fr); gap: 14px; }
  .nb-head .cv { --cw: 56px !important; }
  .nb-head h2 { font-size: 1.5rem; }
  .nb-kick { margin-bottom: 4px; }
  .nb-by { margin-top: 3px; font-size: 1rem; }
  .nb-facts { margin-top: 4px; font-size: .78rem; }
  .prog { margin-top: 10px; max-width: none; }
  .prog .pace { display: none; }
  .cp:not(.open) .cp-body { display: none; }
  .cp:not(.open) .cp-bar { display: flex; }
  .cp { padding: 12px 14px; }
  .cp textarea { font-size: 16px; }
  .cp-opts { flex: 1 0 100%; }
  .cp-act { flex: 1 0 100%; justify-content: space-between; }
  .pagef input, .prog .pace { flex-basis: 100%; }
.prog .pg input { font-size: 16px; }
  .nb-bar { margin-top: 18px; }
  .nb-meta { font-size: .86rem; }
  .lnk { font-size: .88rem; }
  .nb-e { padding: 16px 0; }
}

.bookcard .bprog { display: grid; gap: 8px; width: 100%; max-width: 300px; margin-top: 16px; text-align: left; }
.bookcard .bprog .bar { height: 5px; border-radius: 3px; background: var(--paper-line); overflow: hidden; }
.bookcard .bprog .bar i { display: block; height: 100%; width: var(--v); background: var(--paper-accent); }
.bookcard .bprog .pg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--paper-muted); font-size: .86rem; }
.bookcard .bprog .pg input { width: 4.2em; height: 34px; padding: 0 8px; border: 1px solid var(--paper-line); border-radius: 8px; background: transparent; color: var(--paper-ink); font: inherit; font-variant-numeric: tabular-nums; }
.bookcard .bprog .pace { flex-basis: 100%; }

.cv-btn { position: relative; display: inline-block; padding: 0; border: 0; background: none; border-radius: 4px; cursor: pointer; }
.cv-hint { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 12px; border-radius: 0 0 4px 2px; background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #f4ead8; font-size: .82rem; font-weight: 500; text-align: center; opacity: 0; transition: opacity .18s; pointer-events: none; }
@media (hover: hover) { .cv-btn:hover .cv-hint { opacity: 1; } }
.cv-btn:focus-visible .cv-hint { opacity: 1; }
.tap-hint { display: none; align-items: center; gap: 2px; margin-top: 8px; padding: 0; background: none; color: var(--muted); font-size: .86rem; }
.tap-hint .i { width: 14px; height: 14px; }
.cv-hint { display: none; }
@container (min-width: 900px) { .cv-hint { display: block; } }
@container (max-width: 640px) { .tap-hint { display: inline-flex; } }

/* v8 */
.bookcard.card { width: min(880px, 100%); grid-template-columns: 240px minmax(0, 1fr); }
.bookcard .page-r { padding: 36px 36px 30px; }
.bookcard .bprog { max-width: none; margin-top: 20px; }
.bookcard .acts { margin-top: 24px; gap: 8px; }
input[type=number] { appearance: textfield; -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.cv:has(> span:empty)::after { display: none; }
@container (max-width: 640px) {
  .cp-opts, .cp-act { display: contents; }
}

.screen.phone .bookcard .x { color: var(--fg); background: color-mix(in oklab, var(--fg) 16%, transparent); border-color: transparent; }
.screen.phone .bookcard .bprog .pg { justify-content: center; text-align: center; }

/* v10: the footer is one row of equal pills; Page turns into its own field */
.btn[hidden], .pg-on[hidden] { display: none !important; }
.pg-on { cursor: text; gap: 6px; }
.pg-on input, .pg-on .where { width: 4.5em; min-width: 0; height: 100%; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 500; outline: none; box-shadow: none; field-sizing: content; max-width: 9em; display: inline-flex; align-items: center; }
.pg-on .where.ed, .pg-on .where.ed:focus { background: none; box-shadow: none; border-radius: 0; }
.pg-on:focus-within { border-color: color-mix(in oklab, var(--accent) 60%, transparent); }
/* a Page button holding a number reads as switched on, like Passage and Public */
.pg-on:has(input:not(:placeholder-shown)), .pg-on:has(.ed:not(:empty)) { background: color-mix(in oklab, var(--accent) 16%, var(--surface)); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
.pg-on:has(input:not(:placeholder-shown)):focus-within, .pg-on:has(.ed:not(:empty)):focus-within { border-color: color-mix(in oklab, var(--accent) 60%, transparent); }
.pg-on .ed:empty::before { content: attr(data-ph); color: var(--muted); opacity: .8; }
/* editing a note: the same surface as the composer, nothing tinted, nothing outside the column */
.nb-e.editing { gap: 12px; margin-inline: 0; padding: 14px 16px; border: 1px solid color-mix(in oklab, var(--accent) 45%, var(--line)); border-radius: 12px; background: var(--surface); }
.nb-e.editing .ed, .nb-e.editing .ed:focus { background: none; box-shadow: none; border-radius: 0; }
.nb-e.editing blockquote.ed { border-radius: 0; }
.nb-e.editing .nb-meta { min-height: 0; }
@container (max-width: 640px) {
  .nb-e.editing { padding: 12px 14px; }
  .cp-foot { flex-wrap: nowrap; gap: 6px; }
  .pg-on input, .pg-on .where { flex: 1 1 auto; width: 100%; max-width: none; }
  @media (pointer: coarse) { .pg-on input, .pg-on .where { font-size: 16px; } }
}

/* v11: icon pills, static sizes, a way out of the editor */
.btn .lb { white-space: nowrap; }
.pg-add { width: auto; }
.pg-on { width: 140px; }
.pg-on { cursor: text; }
.pg-on input, .pg-on .where { flex: 1 1 auto; width: 100%; min-width: 0; max-width: none; field-sizing: fixed; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ed { min-height: 1.5em; }
.pg-on .ed { min-height: 0; }
.cp, .nb-e.editing { position: relative; }
.cp-x { position: absolute; top: 8px; right: 8px; z-index: 2; width: var(--ctl); height: var(--ctl); }
.cp-x .i { width: 18px; height: 18px; }
.nb-e.editing:has(.cp-x) .cp-fields > :first-child, .cp-body:has(.cp-x) .cp-fields > :first-child { padding-right: calc(var(--ctl) + 8px); }
.bookcard .bprog .pace { flex-basis: auto; margin-left: auto; }
.bookcard .bprog .pg { flex-wrap: nowrap; }
.screen.phone .layer .bookcard.card { padding: 0; }
.screen.phone .bookcard .x { top: 12px; right: 12px; }
.screen.phone .bookcard .bprog .pg { flex-wrap: wrap; }
.screen.phone .bookcard .bprog .pace { flex-basis: 100%; margin-left: 0; }
@container (max-width: 640px) {
  .cp-foot { gap: 6px; }
  .cp-foot .btn, .cp-foot .pg-add, .cp-foot .pg-on { flex: 1 1 0; width: auto; min-width: 0; padding: 0; justify-content: center; gap: 5px; }
  .cp-foot .btn .lb { display: none; }
  .cp-foot .btn.primary .lb, .cp-foot .btn.primary { display: inline-flex; }
  .cp-foot .pg-on input, .cp-foot .pg-on .where { text-align: left; }
}

/* v12 */

function mdEntry(e, priv) {
  const body = [e.quote ? e.quote.split("\n").map((l) => "> " + l).join("\n") : "", e.text].filter(Boolean).join("\n\n");
  const meta = [e.where ? whereText(e.where) : "", fmtD(e.at, true), priv && !e.public ? "Private" : ""].filter(Boolean).join(" · ");
  return `${body}\n\n*${meta}*\n`;
}
function mdBook(b, priv, h) {
  const es = allOf(b.id).filter((e) => priv || e.public); if (!es.length) return "";
  const rs = readingsOf(b.id), hh = "#".repeat(h), sub = "#".repeat(h + 1);
  let out = `${hh} ${b.title}\n\n*${b.author} · ${b.year}*\n\n`;
  const groups = rs.map((r) => [r, es.filter((e) => e.reading === r.id)]).filter(([, l]) => l.length);
  const loose = es.filter((e) => !rs.some((r) => r.id === e.reading));
  const asc = (l) => l.slice().sort((a, c) => Date.parse(a.at) - Date.parse(c.at));
  if (rs.length < 2 && !loose.length) out += asc(es).map((e) => mdEntry(e, priv)).join("\n");
  else {
    for (const [r, l] of groups) out += `${sub} ${readingName(r) ? readingName(r) + " — " : ""}${r.outcome === "reading" ? "under way" : r.year ? "finished " + r.ended : "finished " + fmtD(r.ended + "T12:00:00", true)}\n\n` + asc(l).map((e) => mdEntry(e, priv)).join("\n") + "\n";
    if (loose.length) out += `${sub} Not tied to a reading\n\n` + asc(loose).map((e) => mdEntry(e, priv)).join("\n");
  }
  return out.trimEnd() + "\n";
}
function mdFor(scope, priv) {
  if (scope === "book") { const b = bookOf(S.exp.book); return `---\ntitle: "${b.title}"\nauthor: "${b.author}"\nyear: ${b.year}\nnotes: ${allOf(b.id).filter((e) => priv || e.public).length}\n---\n\n` + (mdBook(b, priv, 1) || "(No notes to export.)\n"); }
  const blocks = BOOKS.map((b) => mdBook(b, priv, 2)).filter(Boolean);
  return `# Notes from Back Room Books\n\n*${plural(blocks.length, "book")} · exported ${fmtLong("2026-10-14")}${priv ? "" : " · public notes only"}*\n\n` + blocks.join("\n");
}

/* ---------- A book finder: type to narrow, never a list of every book ---------- */

  const cap = n ? 5 : 4, shown = !n && kind === "hide" ? [] : hits.slice(0, cap);

  return `<div class="finder"><label class="fsearch">${svg("search")}<input type="search" id="bf-${kind}" class="inp" placeholder="Find a book by title or author" value="${esc(q)}" data-bf="${kind}" autocomplete="off" aria-label="Find a book"></label>
    ${shown.length ? `<p class="fcap">${n ? plural(hits.length, "match").replace("matchs", "matches") : "Most recent notes"}</p><ul class="flist">${shown.map((b) => { const t = allOf(b.id).length, p = allOf(b.id).filter((e) => e.public).length;

function change(name, el) {
  const [k, v] = name.split(/:(.*)/);
  switch (k) {
    case "book-vis": bookOf(S.bookId).notesHidden = !el.checked; toast(el.checked ? "Visitors can read this book’s public notes" : "This book’s notes are hidden from visitors"); break;
    case "set": S.settings[v] = el.checked; if (v === "notes" && !el.checked) toast("Visitors can no longer read any notes"); break;
    case "exp-priv": S.exp.includePrivate = el.checked; break;
    case "page": PROGRESS[v] = Math.max(0, Math.min(bookOf(v).pages, +el.value || 0)); toast(`On page ${PROGRESS[v]}`); break;
    default: return;
  }
  render();
}
function bind(path, value) { const [o, f] = path.split("."); S.cp[f] = value; }

document.addEventListener("click", (ev) => { if (S.menu && !ev.target.closest(".more")) { S.menu = null; render(); } const el = ev.target.closest("[data-act]"); if (el) act(el.dataset.act, el, ev); const p = ev.target.closest("[data-pressed]"); if (p) { const [k, v] = p.dataset.pressed.split(":"); S[k] = v; if (k === "scene" && v === "settings") S.settingsSection = "visitors"; S.modal = null; render(); } });
document.addEventListener("change", (ev) => { const el = ev.target.closest("[data-act-change]"); if (el) change(el.dataset.actChange, el); if (ev.target.id === "clip-file") { const f = ev.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { const parsed = parseClippings(String(rd.result)); S.imp = parsed.length ? { stage: "review", parsed, public: false, name: f.name } : { stage: "idle", parsed: null, public: false, name: "" }; if (!parsed.length) toast("That doesn’t look like a Kindle clippings file"); render(); }; rd.readAsText(f); } });
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.bf) { S.bf[t.dataset.bf] = t.value; return render(); }
  if (t.dataset.bind) {
    if (t.dataset.bind === "cp.where") t.value = t.value.replace(/\D/g, "");
    bind(t.dataset.bind, t.value);
  }
});
/* Editing a note in place (after "Edit"): the text is the editor. Leaving a field saves it; Esc puts it back. */
const entryOf = (t) => ENTRIES.find((x) => x.id === +t.dataset.id);
document.addEventListener("beforeinput", (ev) => { const t = ev.target; if (t.dataset && t.dataset.ed === "where" && ev.data && /\D/.test(ev.data)) ev.preventDefault(); });
document.addEventListener("focusin", (ev) => {
  const t = ev.target;
  if (!(t.dataset && t.dataset.ed)) return;
  if (t.dataset.ed === "where") { t.textContent = whereField(entryOf(t).where); const r = document.createRange(); r.selectNodeContents(t); r.collapse(false); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }

});
let kindTap = 0; document.addEventListener("pointerdown", (ev) => { if (ev.target.closest && ev.target.closest(".pg-kind")) kindTap = Date.now(); });
const foldPage = (t) => { const row = t.closest(".cp-foot"); row.querySelector(".pg-on").hidden = true; row.querySelector(".pg-add").hidden = false; };
document.addEventListener("focusout", (ev) => {
  const t = ev.target;
  if (t.id === "cp-where" && !t.value.trim() && Date.now() - kindTap > 500) { S.cp.showPage = false; S.cp.where = ""; foldPage(t); }
  if (!(t.dataset && t.dataset.ed)) return;
  const e = entryOf(t), f = t.dataset.ed, raw = t.textContent.replace(/ /g, " ").trim(), li = t.closest(".nb-e");
  const saved = () => { const el = li.querySelector(".saved"); el.textContent = "Saved"; clearTimeout(saved.t); saved.t = setTimeout(() => { el.textContent = ""; }, 1800); };
  if (f === "where") {
    const kind = e.where ? e.where.k : (S.add && S.add.kind) || "page", w = whereFrom(kind, raw), changed = whereField(w) !== whereField(e.where);
    if (!w && Date.now() - kindTap < 500) return;
    e.where = w; t.textContent = whereField(w); if (changed) saved(); if (!w) { if (S.add) S.add = null; foldPage(t); } return;
  }
  const rest = ["pre", "quote", "text"].some((k) => k !== f && e[k] && e[k].trim());
  if (f === "quote" && !raw) S.add = { id: e.id, f: "quote" };
  const changed = raw !== e[f]; e[f] = raw; t.textContent = raw; if (changed) saved();
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target.dataset.form;
  if (f === "cp") { if (keepEntry()) { document.activeElement && document.activeElement.blur(); } render(); }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && S.menu) { S.menu = null; render(); }
  if (ev.key === "Escape" && S.modal) { S.modal = null; render(); }
  const ed = ev.target.dataset && ev.target.dataset.ed;
  if (ed && (ev.key === "Escape" || (ed === "where" && ev.key === "Enter") || ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter"))) { ev.preventDefault(); if (ev.key === "Escape") { const e = entryOf(ev.target); ev.target.textContent = ed === "where" ? whereField(e.where) : e[ed]; } ev.target.blur(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") { const f = ev.target.closest && ev.target.closest("form[data-form]"); if (f) f.requestSubmit(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.id === "drop") { ev.preventDefault(); $("#clip-file").click(); }
});
document.addEventListener("dragover", (ev) => { if (ev.target.closest && ev.target.closest("#drop")) { ev.preventDefault(); ev.target.closest("#drop").classList.add("over"); } });
document.addEventListener("dragleave", (ev) => { const d = ev.target.closest && ev.target.closest("#drop"); d && d.classList.remove("over"); });
document.addEventListener("drop", (ev) => { if (ev.target.closest && ev.target.closest("#drop")) { ev.preventDefault(); const f = ev.dataTransfer.files[0]; if (f) { const input = $("#clip-file"); const dt = new DataTransfer(); dt.items.add(f); input.files = dt.files; input.dispatchEvent(new Event("change", { bubbles: true })); } } });

resetCp(); S.exp.scope = "all";
// A bare #token (or several joined by "-") opens a screen or a layer directly, e.g. #notes-phone-visitor.
for (const t of location.hash.slice(1).split("-")) {
  if (["notes", "timeline", "settings"].includes(t)) S.scene = t;
  else if (["owner", "visitor"].includes(t)) S.role = t;
  else if (["desktop", "phone"].includes(t)) S.device = t;
  else if (["light", "dark"].includes(t)) S.theme = t;
  else if (t === "book") S.modal = "book";
  else if (t === "export") { S.modal = "export"; S.exp.scope = "all"; }
  else if (t === "library") { S.scene = "settings"; S.settingsSection = "library"; }
  else if (t === "import") { S.scene = "settings"; S.settingsSection = "library"; S.imp = { stage: "review", parsed: parseClippings(SAMPLE), public: false, name: "the sample file" }; }
  else if (t === "menu") S.modal = "menu";
  else if (t === "compose") S.cp = { ...S.cp, quote: "Every limit is a beginning as well as an ending.", text: "", where: "380" };
  else if (t === "edit") S.edit = 2;
  else if (t === "editc") S.edit = 3;
  else if (t === "full") S.cp = { ...S.cp, open: true, showQuote: true, showPage: true, quote: "Every limit is a beginning.", where: "63", wkind: "chapter", pre: "Thoughts first.", hasPre: true };
  else if (t === "share") { S.menu = "book"; }
  else if (t === "bookpage") { S.modal = "book"; }
  else if (t === "menuall") { S.menu = "all"; }
  else if (t === "settings2") { S.scene = "settings"; S.settingsSection = "visitors"; }
}
render();

</script>
