# Builds and tests Bookshelf, and on a version tag (v2.0.0) publishes it:
# Docker images for amd64 and arm64 on GHCR, plain programs for Linux, macOS
# and Windows, and a draft GitHub release to review before publishing.
# Run it by hand (Actions → Release → Run workflow) to build and test without
# publishing anything.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/aloglu/bookshelf
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          version="$(node -p "require('./web/package.json').version")"
          if [ "$PUBLISH" = "true" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match web/package.json ($version)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Go
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "Run gofmt on: $unformatted"; exit 1; }
          go vet ./...
          go test ./...

      - uses: actions/upload-artifact@v5
        with:
          name: webdist
          path: cmd/bookshelf/webdist
          retention-days: 3

  docker:
    name: Docker (${{ matrix.arch }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bookshelf:test
          build-args: VERSION=${{ needs.checks.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Smoke test
        run: docker/smoke-test.sh bookshelf:test

      - name: Sign in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.checks.outputs.version }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Keep the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  docker-publish:
    name: Docker (publish)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One image for both architectures
        working-directory: digests
        run: |
          version="${{ needs.checks.outputs.version }}"
          # Pre-releases (2.0.0-rc.1) get only their own tag; releases also move latest and 2.
          case "$version" in
            *-*) tags=(-t "$IMAGE:$version") ;;
            *) tags=(-t "$IMAGE:$version" -t "$IMAGE:latest" -t "$IMAGE:${version%%.*}") ;;
          esac
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$version"

  programs:
    name: Programs
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: webdist
          path: cmd/bookshelf/webdist

      # Bookshelf is pure Go, so every system's program is built here.
      - name: Build and package
        run: |
          version="${{ needs.checks.outputs.version }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            case "$os" in darwin) system=macos ;; *) system="$os" ;; esac
            name="bookshelf-$version-$system-$arch"
            exe=bookshelf; [ "$os" = windows ] && exe=bookshelf.exe
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$name/$exe" ./cmd/bookshelf
            cp LICENSE "dist/$name/"
            {
              echo "Bookshelf $version"
              echo
              echo "1. Set a password once:   ./bookshelf set-password"
              echo "2. Start Bookshelf:       ./bookshelf"
              echo "3. Open http://localhost:8080 in your browser and sign in as admin."
              echo
              echo "On Windows, use .\\bookshelf.exe instead of ./bookshelf."
              echo
              echo "The full guide: https://github.com/aloglu/bookshelf/blob/main/docs/without-docker.md"
            } > "dist/$name/README.txt"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -la dist

      - name: Try the Linux program
        run: |
          exe="dist/bookshelf-${{ needs.checks.outputs.version }}-linux-amd64/bookshelf"
          "$exe" --version
          data="$(mktemp -d)"
          BOOKSHELF_ADMIN_PASSWORD=ci "$exe" --data-dir "$data" --port 18200 &
          pid=$!
          for _ in $(seq 1 30); do PORT=18200 "$exe" health && break; sleep 1; done
          curl -sf http://127.0.0.1:18200/ | grep -q '<title>Bookshelf</title>'
          kill "$pid"

      - uses: actions/upload-artifact@v5
        with:
          name: programs
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, docker-publish, programs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: programs
          path: assets
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.checks.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" assets/* \
            --draft \
            --title "Bookshelf $version" \
            --notes "Docker: \`docker pull $IMAGE:$version\` (amd64 and arm64). Plain programs for Linux, macOS and Windows are attached. Setup guide: docs/README.md."
