# Builds and tests Bookshelf on every push and pull request: the frontend, the
# Go server with the frontend embedded, and the Docker image's smoke test.
name: CI

on:
  push:
    branches: [main, "v*"]   # main is the release line; v2.1 and the like are the next version
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Go
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "Run gofmt on: $unformatted"; exit 1; }
          go vet ./...
          go test ./...
          go build -o bookshelf ./cmd/bookshelf

      - name: Browser regressions
        working-directory: web
        run: |
          npx playwright install --with-deps chromium firefox
          npm run test:browser

      - name: Keep failed browser traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-failures
          path: web/test-results
          retention-days: 7

      - name: The program serves the frontend
        run: |
          data="$(mktemp -d)"
          BOOKSHELF_ADMIN_PASSWORD=ci ./bookshelf --data-dir "$data" --port 18200 &
          pid=$!
          for _ in $(seq 1 30); do PORT=18200 ./bookshelf health && break; sleep 1; done
          curl -sf http://127.0.0.1:18200/ | grep -q '<title>Bookshelf</title>'
          kill "$pid"

  docker:
    name: Docker
    if: github.ref != 'refs/heads/v2.1.1-review'
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bookshelf:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker/smoke-test.sh bookshelf:test

  # This branch publishes only review tags. Release/latest tags remain owned by release.yml.
  review-image:
    name: Review image (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2.1.1-review'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bookshelf:review
          build-args: VERSION=review-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/aloglu/bookshelf
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=review-${{ matrix.arch }}
          cache-to: type=gha,scope=review-${{ matrix.arch }},mode=max
      - name: Smoke test the candidate
        run: docker/smoke-test.sh bookshelf:review
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE: ghcr.io/aloglu/bookshelf:review-${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker tag bookshelf:review "$IMAGE"
          docker push "$IMAGE"

  review-publish:
    name: Review image (publish)
    needs: review-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures under review tags
        env:
          IMAGE: ghcr.io/aloglu/bookshelf
          REVIEW_SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:review-$REVIEW_SHA" -t "$IMAGE:review-fixes" \
            "$IMAGE:review-$REVIEW_SHA-amd64" "$IMAGE:review-$REVIEW_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:review-$REVIEW_SHA"
          echo "Test image: \`$IMAGE:review-$REVIEW_SHA\` (amd64 and arm64)" >> "$GITHUB_STEP_SUMMARY"
