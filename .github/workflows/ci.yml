# Builds and tests Bookshelf on every push and pull request: the frontend, the
# Go server with the frontend embedded, and the Docker image's smoke test.
name: CI

on:
  push:
    branches: [main, "v*"]   # main is the release line; v2.1 and the like are the next version
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Go
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "Run gofmt on: $unformatted"; exit 1; }
          go vet ./...
          go test ./...
          go build -o bookshelf ./cmd/bookshelf

      - name: Browser regressions
        run: |
          # Keep the image version aligned with Playwright in web/package-lock.json.
          # Its browsers and system libraries avoid apt mirror downloads during checks.
          docker run --rm --init --shm-size=1g \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" -w /work/web \
            -e BOOKSHELF_TEST_BINARY=/work/bookshelf \
            -e npm_config_cache=/tmp/bookshelf-npm -e CI=true \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf \
            npm run test:browser

      - name: Keep failed browser traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-failures
          path: web/test-results
          retention-days: 7

      - name: The program serves the frontend
        run: |
          data="$(mktemp -d)"
          BOOKSHELF_ADMIN_PASSWORD=ci ./bookshelf --data-dir "$data" --port 18200 &
          pid=$!
          for _ in $(seq 1 30); do PORT=18200 ./bookshelf health && break; sleep 1; done
          curl -sf http://127.0.0.1:18200/ | grep -q '<title>Bookshelf</title>'
          kill "$pid"

  docker:
    name: Docker
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bookshelf:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker/smoke-test.sh bookshelf:test
